<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>University Research Opportunity Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark portal-navbar">
    <div class="container">
      <span class="navbar-brand mb-0 h1">University Research Opportunity Portal</span>
      <button id="addBtn" class="btn btn-light btn-sm fw-semibold">+ Add Opportunity</button>
    </div>
  </nav>

  <main class="container py-4">
    <!-- Success / error messages -->
    <div id="alertArea"></div>

    <h2 class="h4 mb-3">Research Opportunities</h2>

    <!-- Opportunities list -->
    <div id="opportunityList" class="row g-3"></div>
  </main>

  <!-- Details modal -->
  <div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Opportunity Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="detailsBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close window</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Create / Edit form modal -->
  <div class="modal fade" id="formModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <form id="opportunityForm" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="formTitle">Add Opportunity</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="opportunityId">
            <div id="formAlert"></div>
            <div class="row g-3">
              <div class="col-12">
                <label for="title" class="form-label">Research title *</label>
                <input type="text" class="form-control" id="title" maxlength="255">
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-12">
                <label for="description" class="form-label">Research description *</label>
                <textarea class="form-control" id="description" rows="3"></textarea>
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="research_area" class="form-label">Research area *</label>
                <input type="text" class="form-control" id="research_area" maxlength="150">
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="faculty_name" class="form-label">Faculty member's name *</label>
                <input type="text" class="form-control" id="faculty_name" maxlength="150">
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="department" class="form-label">Department *</label>
                <input type="text" class="form-control" id="department" maxlength="150">
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="required_skills" class="form-label">Required skills *</label>
                <input type="text" class="form-control" id="required_skills" maxlength="500" placeholder="e.g. Python, Machine Learning">
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-4">
                <label for="available_positions" class="form-label">Available positions *</label>
                <input type="number" class="form-control" id="available_positions" min="1" step="1">
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-4">
                <label for="application_deadline" class="form-label">Application deadline *</label>
                <input type="date" class="form-control" id="application_deadline">
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-4">
                <label for="status" class="form-label">Status *</label>
                <select class="form-select" id="status">
                  <option value="Open">Open</option>
                  <option value="Closed">Closed</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Delete confirmation modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Delete Opportunity</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Are you sure you want to delete <strong id="deleteName"></strong>? This cannot be undone.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
