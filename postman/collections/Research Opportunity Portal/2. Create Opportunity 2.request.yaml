$kind: http-request
url: "{{baseUrl}}/opportunities"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "Renewable Energy Storage",
      "description": "Study of battery storage for solar power systems.",
      "research_area": "Energy Systems",
      "faculty_name": "Dr. Imran Ali",
      "department": "Electrical Engineering",
      "required_skills": "MATLAB, Circuit Design",
      "available_positions": 3,
      "application_deadline": "2026-11-30",
      "status": "Open"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201 Created', function () { pm.response.to.have.status(201); });
      var data = pm.response.json();
      var rec = data.data || data;
      pm.collectionVariables.set('id2', rec.id);
    language: text/javascript
order: 2000
